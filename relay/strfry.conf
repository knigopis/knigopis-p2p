##
## strfry для Книгописи. Остальные параметры — по умолчанию strfry 1.1.3.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Внутри контейнера слушаем все интерфейсы; наружу порт публикуется
    # только на 127.0.0.1 (см. deploy/compose.yml), дальше — Caddy.
    bind = "0.0.0.0"
    port = 7777

    # Лимит файлов задаётся в compose (ulimits): без прав контейнер поднять его не может.
    nofiles = 0

    # Caddy ставит X-Real-IP; по нему плагин режет частоту.
    realIpHeader = "x-real-ip"

    auth {
        enabled = false
        serviceUrl = ""
    }

    info {
        name = "Книгопись"
        description = "Relay Книгописи — списки прочитанных книг. Принимает только события Книгописи."
        pubkey = ""
        contact = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000

    # Списки бывают по 600+ книг — даём забрать за один запрос.
    maxFilterLimit = 5000
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200

    writePolicy {
        plugin = "/app/write-policy.py"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
