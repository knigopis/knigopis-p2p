# Образ узла Книгописи: сайт, архив, relay и Caddy (Dockerfile в корне).
# Собирается на каждый опубликованный релиз (scripts/release.sh) и кладётся
# в ghcr.io/knigopis/knigopis-p2p/node с тегами версии и latest. Вручную —
# Actions → node → Run workflow (тег — по коммиту, latest не трогается).
#
# Только amd64: бесплатные ARM-машины GitHub даёт лишь публичным репозиториям.
# Когда репозиторий станет публичным — добавить linux/arm64.
name: node

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: node-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/node
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}

      # Кеш слоёв: компиляция strfry (~10 мин) повторяется, только когда меняется
      # relay/ или его часть Dockerfile; архив repo2 — когда меняется pack-legacy.mjs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
