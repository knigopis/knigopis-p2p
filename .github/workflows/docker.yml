# Образы главного узла для прода: ghcr.io/<владелец>/knigopis-p2p/{relay,web}.
# На сервере ничего не собирается — release.sh делает git pull + docker-compose pull + up.
#
# push в master  → сборка и публикация :latest и :sha-<коммит>
# pull request   → только сборка (проверка, что собирается), без публикации
# вручную        → Actions → docker → Run workflow
name: docker

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: relay
            context: relay
            dockerfile: relay/Dockerfile
          - name: web
            context: .
            dockerfile: build/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Кеш слоёв в GitHub Actions: компиляция strfry (~10 мин) повторяется,
      # только когда меняется relay/, архив repo2 — когда меняется pack-legacy.mjs.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
