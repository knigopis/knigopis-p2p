# Узел за nginx-proxy с acme-companion (https://github.com/nginx-proxy): они получают
# сертификат и держат HTTPS, а Caddy узла без TLS раскладывает запросы между сайтом
# и relay. Подключается в .env:
#   COMPOSE_FILE=compose.yml:compose.nginx-proxy.yml
# Строку COMPOSE_PROFILES=web при этом удалить: порты 80/443 заняты nginx-proxy.
# DOMAIN — основной адрес, REDIRECT_FROM — адреса через запятую, которые
# перенаправляются на него. Сертификат — на все.
services:
  proxied:
    image: caddy:2
    restart: unless-stopped
    depends_on: [relay]
    environment:
      DOMAIN: http://${DOMAIN:?в .env нужен DOMAIN}
      MAIN_HOST: ${DOMAIN}
      VIRTUAL_HOST: ${DOMAIN}${REDIRECT_FROM:+,}${REDIRECT_FROM:-}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}${REDIRECT_FROM:+,}${REDIRECT_FROM:-}
    volumes:
      - ./Caddyfile.nginx-proxy:/etc/caddy/Caddyfile:ro
      - ./Caddyfile:/etc/caddy/site.caddy:ro
      - ./site:/srv:ro
    networks: [default, nginx-proxy]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  nginx-proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
