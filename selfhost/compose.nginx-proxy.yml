# Узел Книгописи за nginx-proxy с acme-companion (https://github.com/nginx-proxy):
# они получают сертификат и держат HTTPS. DOMAIN — основной адрес, REDIRECT_FROM —
# адреса через запятую, которые перенаправляются на него; сертификат — на все.
#
#   docker compose up -d                              запуск
#   docker compose pull && docker compose up -d       обновление
name: knigopis

services:
  node:
    image: ghcr.io/knigopis/knigopis-p2p/node:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BEHIND_PROXY: "1"
      VIRTUAL_HOST: ${DOMAIN:?в .env нужен DOMAIN}${REDIRECT_FROM:+,}${REDIRECT_FROM:-}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}${REDIRECT_FROM:+,}${REDIRECT_FROM:-}
    volumes:
      - relay-data:/app/strfry-db
    networks: [nginx-proxy]
    ulimits:
      nofile: 65536
    # Ограничения: узлу хватает десятков мегабайт; прав — только порты 80/443, смена
    # пользователя для strfry и сигналы ему (KILL). MEM_LIMIT в .env — если записей станет очень много.
    # no-new-privileges не ставить: на Ubuntu 24.04 с AppArmor контейнер с ним не запускается
    # (exec /sbin/tini: operation not permitted).
    mem_limit: ${MEM_LIMIT:-512m}
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, KILL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  relay-data:

networks:
  nginx-proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
