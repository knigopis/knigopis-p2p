# Узел Книгописи за уже работающим веб-сервером (nginx, Caddy): тот держит HTTPS
# и передаёт сюда все запросы, включая WebSocket. Узел слушает 127.0.0.1:8080
# (порт — PORT в .env). Примеры для nginx и Caddy — в README.md.
#
#   docker compose up -d                              запуск
#   docker compose pull && docker compose up -d       обновление
name: knigopis

services:
  node:
    image: ghcr.io/knigopis/knigopis-p2p/node:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BEHIND_PROXY: "1"
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    volumes:
      - relay-data:/app/strfry-db
    ulimits:
      nofile: 65536
    # Ограничения: узлу хватает десятков мегабайт. MEM_LIMIT в .env — если записей станет очень много.
    # Урезать права (cap_drop, no-new-privileges) пока нельзя: на Docker 24 контейнер с ними
    # не запускается (exec /sbin/tini: operation not permitted).
    mem_limit: ${MEM_LIMIT:-512m}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  relay-data:
