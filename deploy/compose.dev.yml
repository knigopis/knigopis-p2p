# Два relay для разработки (npm run relay): основной на 7777 и «реплика» на 7778,
# которая раз в 30 секунд синхронизируется с основным. Так проверяются и работа
# с несколькими relay, и синхронизация.
#   VITE_RELAYS=ws://localhost:7777,ws://localhost:7778 npm run dev
# Образ — relay из общего Dockerfile (собирается при первом запуске, ~5 мин).
name: knigopis-dev

x-relay: &relay
  image: knigopis-relay:dev
  build:
    context: ..
    target: relay
  restart: unless-stopped
  ulimits:
    nofile: 65536

services:
  relay:
    <<: *relay
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - relay-data:/app/strfry-db

  replica:
    <<: *relay
    environment:
      UPSTREAM: ws://relay:7777
      SYNC_INTERVAL: 30
    ports:
      - "127.0.0.1:7778:7777"
    volumes:
      - replica-data:/app/strfry-db

volumes:
  relay-data:
  replica-data:
