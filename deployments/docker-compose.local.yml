# Узел целиком на своей машине, без nginx-proxy: http://localhost:8080
#   make up / make stop
version: '3.5'

services:
  relay:
    build: ./../relay
    image: knigopis-relay:latest
    volumes:
      - relay-data:/app/strfry-db
    ulimits:
      nofile: 65536

  web:
    build:
      context: ./../
      dockerfile: ./build/Dockerfile
    depends_on:
      - relay
    environment:
      DOMAIN: "http://localhost"
      MAIN_HOST: "localhost:8080"
    ports:
      - "8080:80"

volumes:
  relay-data:
